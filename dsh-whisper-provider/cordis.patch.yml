# Stack de voz de DSH + proveedor Whisper local.
#
# Las cuatro filas se insertan en orden: el servicio, el proveedor, el remote
# autenticado que usa el navegador y el botón de micrófono de la UI.
#
# Requisito: NO activar a la vez el bundle oficial
# `@deepseek-ai/dsh-experimental-voice-input-bundle`; inserta las mismas filas
# (speech-to-text, api-speech-to-text, ui-voice-input) y habría conflicto de ids.
- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: whisper-local
        language: es
    - id: speech-to-text-whisper
      name: dsh-whisper-provider
      config:
        serviceUrl: http://127.0.0.1:8756
        # El motor se aprovisiona en %LOCALAPPDATA%\dsh-whisper.
        # dataDir: D:/whisper-data        # opcional
        # model: medium                   # tiny, small, medium, large-v3…
        # computeType: int8
        # healthTimeoutMs: 900000
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: ui-voice-input
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-input'
